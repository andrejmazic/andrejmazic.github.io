<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get PULSE - Reflex Defense</title>
<meta name="description" content="Download PULSE: Reflex Defense - free on iOS and Android.">
<meta property="og:title" content="Get PULSE - Reflex Defense">
<meta property="og:description" content="Hypnotic neon arcade. Defend both sides. Free on iOS &amp; Android.">
<meta property="og:url" content="https://mazzox.com/get">
<meta name="theme-color" content="#05050F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305050F'/%3E%3Crect x='30.5' y='8' width='3' height='48' fill='%23181840'/%3E%3Ccircle cx='20' cy='25' r='7' fill='%2300FFFF'/%3E%3Ccircle cx='44' cy='40' r='7' fill='%23FF00FF'/%3E%3C/svg%3E">
<style>
  :root {
    --cyan: #00FFFF;
    --magenta: #FF00FF;
    --void: #05050F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--void);
    background-image:
      linear-gradient(rgba(0, 255, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 255, 0.045) 1px, transparent 1px),
      radial-gradient(ellipse at 50% 40%, #0B0B22 0%, var(--void) 75%);
    background-size: 100% 48px, 48px 100%, 100% 100%;
    color: #E8E8F0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: clamp(44px, 12vw, 84px);
    font-weight: 800;
    letter-spacing: 0.14em;
    margin-right: -0.14em;
    color: #FFFFFF;
    text-shadow: -3px 0 var(--magenta), 3px 0 var(--cyan), 0 0 28px rgba(0, 255, 255, 0.35);
    user-select: none;
  }
  .status {
    margin-top: 18px;
    font-size: 13px;
    letter-spacing: 0.3em;
    margin-right: -0.3em;
    text-transform: uppercase;
    color: rgba(0, 255, 255, 0.55);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .buttons {
    margin-top: 36px;
    display: grid;
    gap: 14px;
    justify-items: center;
  }
  .btn {
    display: inline-block;
    width: 100%;
    max-width: 320px;
    box-sizing: border-box;
    text-align: center;
    padding: 13px 24px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-decoration: none;
    color: var(--cyan);
    border: 1px solid rgba(0, 255, 255, 0.75);
    border-radius: 8px;
    background: rgba(0, 255, 255, 0.04);
    box-shadow: 0 0 12px rgba(0, 255, 255, 0.18), inset 0 0 12px rgba(0, 255, 255, 0.06);
  }
  .btn:hover {
    background: rgba(0, 255, 255, 0.10);
    box-shadow: 0 0 26px rgba(0, 255, 255, 0.45), inset 0 0 16px rgba(0, 255, 255, 0.10);
  }
  .site-link {
    margin-top: 22px;
    font-size: 13px;
  }
  .site-link a { color: rgba(0, 255, 255, 0.75); text-decoration: none; }
  .site-link a:hover { text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); }
  @media (prefers-reduced-motion: reduce) {
    .status { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>PULSE</h1>
  <p class="status" id="status">Opening your store&hellip;</p>
  <div class="buttons">
    <a class="btn" id="btn-ios" href="https://apps.apple.com/app/id6788370654">DOWNLOAD ON THE APP STORE</a>
    <a class="btn" id="btn-android" href="https://play.google.com/store/apps/details?id=com.andrejmazic.pulse">GET IT ON GOOGLE PLAY</a>
  </div>
  <p class="site-link"><a href="https://mazzox.com/">mazzox.com</a></p>
</main>
<script>
(function () {
  "use strict";

  /* ---- CONFIG ---- */
  var GOAT_HOST = "https://mazzox.goatcounter.com"; /* GoatCounter site code */
  var APPLE_PT = "129128131"; /* App Analytics provider token */
  /* ---------------- */

  var APPSTORE = "https://apps.apple.com/app/id6788370654";
  var PLAY = "https://play.google.com/store/apps/details?id=com.andrejmazic.pulse";
  var LANDING = "https://mazzox.com/";

  var raw = new URLSearchParams(location.search).get("c") || "direct";
  var channel = /^[a-z0-9_-]{1,24}$/.test(raw) ? raw : "other";

  var img = new Image();
  img.src = GOAT_HOST + "/count?p=" + encodeURIComponent("/get/" + channel)
    + "&t=" + encodeURIComponent("smart link: " + channel)
    + "&rnd=" + Date.now();

  var playUrl = PLAY + "&referrer=" + encodeURIComponent(
    "utm_source=" + channel + "&utm_medium=smartlink&utm_campaign=pulse");
  var iosUrl = APPSTORE + (APPLE_PT ? "?pt=" + APPLE_PT + "&ct=" + channel + "&mt=8" : "?ct=" + channel);

  document.getElementById("btn-ios").href = iosUrl;
  document.getElementById("btn-android").href = playUrl;

  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua);
  /* iPadOS 13+ masquerades as Macintosh; touch support gives it away */
  var isIOS = /iPhone|iPad|iPod/i.test(ua)
    || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  var dest = isAndroid ? playUrl : (isIOS ? iosUrl : LANDING);
  if (!isAndroid && !isIOS) {
    document.getElementById("status").textContent = "Free on iOS & Android";
  }

  /* Short delay so the count pixel gets on the wire; imperceptible to the user.
     Desktop stays on this page (buttons + link) instead of bouncing to the landing. */
  if (isAndroid || isIOS) {
    setTimeout(function () { location.replace(dest); }, 250);
  }
})();
</script>
</body>
</html>
